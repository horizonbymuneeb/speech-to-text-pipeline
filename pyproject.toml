[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-to-text-pipeline"
version = "0.1.0"
description = "Streaming CPU speech recognition over a synthetic speech corpus: VAD, log-mel features, a small CTC model and WER/CER scoring"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3.0", "torch>=2.1,<3.0", "PyYAML>=6.0,<7.0"]
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7.4,<9.0"]

[project.scripts]
asr-pipeline = "asr.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
